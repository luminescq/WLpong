[package]
name = "wl"
version = "0.1.0"
edition = "2021"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(frb_expand)'] }

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
tokio = { version = "1.42", default-features = false, features = ["net", "time", "rt"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
flutter_rust_bridge = { version = "=2.12.0", features = ["rust-async"] }
hickory-resolver = "0.24.1"

[dev-dependencies]
tokio = { version = "1.42", features = ["net", "time", "rt", "macros", "rt-multi-thread"] }

